name: Constitutional Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Branch protection is external to this workflow. The check produced here is:
# Constitutional Audit / constitutional-audit
jobs:
  constitutional-audit:
    name: constitutional-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify complete Git history
        run: test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python3 -m pip install --requirement requirements-dev.txt

      - name: Capture CI evaluation instant
        shell: bash
        run: |
          audit_evaluation_instant="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          printf 'AUDIT_EVALUATION_INSTANT=%s\n' \
            "$audit_evaluation_instant" >> "$GITHUB_ENV"

      - name: Run complete test suite
        run: python3 -m unittest discover -v

      - name: Compile Python sources
        run: |
          python3 -m compileall -q \
            builder.py \
            builder_cli.py \
            builders \
            template_system \
            capability_introspection \
            constitutional_audit \
            tests

      - name: Run governance verification
        env:
          AUDIT_EVALUATION_INSTANT: ${{ env.AUDIT_EVALUATION_INSTANT }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime

          raw_instant = os.environ.get("AUDIT_EVALUATION_INSTANT", "")
          try:
              from constitutional_audit import audit_camilobuilder

              instant = datetime.fromisoformat(raw_instant.replace("Z", "+00:00"))
              report = audit_camilobuilder(evaluation_instant=instant)
              findings = report["findings"]
              declared_exceptions = report["declared_exceptions"]
              active_ids = [
                  item["id"] for item in declared_exceptions
                  if item["status"] == "active"
              ]
              controls = report["automated_controls"]
              calculated_summary = {
                  "passed": sum(item["status"] == "passed" for item in controls),
                  "failed": sum(item["status"] == "failed" for item in controls),
                  "excepted": sum(item["status"] == "excepted" for item in controls),
                  "indeterminate": sum(
                      item["status"] == "indeterminate" for item in controls
                  ),
              }
              material_failures = [
                  item for item in findings
                  if item["outcome"] == "failed"
                  and item["severity"] in {"critical", "error"}
              ]
              material_control_failures = [
                  item for item in controls
                  if item["status"] == "failed"
                  and item["severity"] in {"critical", "error"}
              ]
              indeterminate_findings = [
                  item for item in findings if item["outcome"] == "indeterminate"
              ]
              indeterminate_controls = [
                  item for item in controls if item["status"] == "indeterminate"
              ]
              excepted_findings = [
                  item for item in findings if item["outcome"] == "excepted"
              ]
              invalid_exception_links = [
                  item for item in excepted_findings
                  if item["exception_id"] not in active_ids
              ]
              applied_ids_by_exception = {
                  item["id"]: sorted(item["applied_finding_ids"])
                  for item in declared_exceptions
              }
              actual_ids_by_exception = {
                  exception_id: sorted(
                      item["id"] for item in excepted_findings
                      if item["exception_id"] == exception_id
                  )
                  for exception_id in active_ids
              }
              inconsistent_exception_evidence = any(
                  applied_ids_by_exception.get(exception_id, [])
                  != actual_ids_by_exception.get(exception_id, [])
                  for exception_id in active_ids
              )
              expired_findings = [
                  item for item in findings
                  if item["code"] in {
                      "active-exception-expired",
                      "expired-exception",
                  }
              ]
              internally_consistent = (
                  report["automated_summary"] == calculated_summary
              )
              accepted = (
                  report["automated_result"] == "verified"
                  and not material_failures
                  and not material_control_failures
                  and not indeterminate_findings
                  and not indeterminate_controls
                  and not excepted_findings
                  and internally_consistent
              )
              if report["automated_result"] == "verified_with_declared_exceptions":
                  accepted = (
                      bool(active_ids)
                      and bool(excepted_findings)
                      and not material_failures
                      and not material_control_failures
                      and not indeterminate_findings
                      and not indeterminate_controls
                      and not invalid_exception_links
                      and not inconsistent_exception_evidence
                      and not expired_findings
                      and internally_consistent
                  )
              diagnostic = {
                  "automated_result": report["automated_result"],
                  "automated_summary": report["automated_summary"],
                  "declared_exceptions": declared_exceptions,
                  "evaluation_instant": report["evaluation_instant"],
                  "findings": findings,
                  "manual_assertions": report["manual_assertions"],
                  "unverified_obligations": report["unverified_obligations"],
              }
          except Exception:
              accepted = False
              diagnostic = {
                  "automated_result": "indeterminate",
                  "automated_summary": {
                      "excepted": 0,
                      "failed": 0,
                      "indeterminate": 1,
                      "passed": 0,
                  },
                  "declared_exceptions": [],
                  "evaluation_instant": raw_instant,
                  "findings": [],
                  "manual_assertions": [],
                  "unverified_obligations": [],
              }

          print(json.dumps(
              diagnostic,
              ensure_ascii=True,
              sort_keys=True,
              separators=(",", ":"),
          ))
          if not accepted:
              sys.exit(1)
          PY

      - name: Verify final repository state
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

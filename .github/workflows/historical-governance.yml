name: Historical Governance Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-governance:
    name: historical-governance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify complete Git history
        run: test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python3 -m pip install --requirement requirements-dev.txt

      - name: Run historical governance suite
        run: >-
          python3 -m unittest discover
          -s tests/historical
          -p 'historical_*.py'
          -v

      - name: Verify final repository state
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
